<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Обложка канала · Техно-стиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f0f0f0; /* Нейтральный фон подложки */
  }

  /* Круглый контейнер обложки */
  .cover {
    width: min(90vmin, 800px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.15);
    background: #ffffff;
  }
  .cover svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<div class="cover">
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="люди. смыслы. технологии.">
  <defs>
    <!-- Маска для идеального круга -->
    <clipPath id="circleClip">
      <circle cx="500" cy="500" r="500"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Чистый белый фон -->
    <rect width="1000" height="1000" fill="#ffffff"/>

    <!-- Вся графическая композиция повернута по диагонали -->
    <g transform="translate(500, 500) rotate(-35) translate(-500, -500)">
      
      <!-- Лаймовая линия (змейка) -->
      <!-- Используем path с толстым stroke и закругленными концами -->
      <path d="M 150 750 
               C 300 500, 450 400, 500 400 
               C 550 400, 550 650, 600 650 
               C 700 650, 750 300, 850 200" 
            fill="none" 
            stroke="#C1FF00" 
            stroke-width="120" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Текстовая группа -->
      <g font-family="'Manrope', 'Arial Black', sans-serif" 
         font-weight="900" 
         font-size="120" 
         fill="#000000" 
         text-anchor="middle" 
         letter-spacing="2">
        
        <!-- Строка 1 -->
        <text x="500" y="360">люди<tspan fill="#C1FF00">.</tspan></text>
        
        <!-- Строка 2 -->
        <text x="500" y="500">смыслы<tspan fill="#C1FF00">.</tspan></text>
        
        <!-- Строка 3 -->
        <text x="500" y="640">технологии<tspan fill="#C1FF00">.</tspan></text>
        
      </g>
    </g>
  </g>
</svg>
</div>

</body>
</html>
