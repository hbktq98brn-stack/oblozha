<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Обложка канала · Точная копия</title>
<!-- Подключаем максимально жирный шрифт, похожий на ваш -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #e0e0e0; /* Фон подложки для наглядности */
  }

  /* Круглый контейнер обложки */
  .cover {
    width: min(90vmin, 800px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    overflow: hidden;
    background: #ffffff; /* Чистый белый фон, как на картинке */
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }
  .cover svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<div class="cover">
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="люди. смыслы. технологии.">
  <defs>
    <!-- Маска для идеального круга -->
    <clipPath id="circleClip">
      <circle cx="500" cy="500" r="500"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Белый фон -->
    <rect width="1000" height="1000" fill="#ffffff"/>

    <!-- Вся композиция повернута по диагонали (как на вашей картинке) -->
    <g transform="translate(500, 500) rotate(-35) translate(-500, -500)">
      
      <!-- Лаймовая линия (точная копия змейки с картинки) -->
      <path d="M 100 780 
               L 380 400 
               C 500 250, 620 400, 520 550 
               C 420 700, 580 750, 720 600 
               L 900 250" 
            fill="none" 
            stroke="#C1FF00" 
            stroke-width="120" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Текст (идеально выровнен по одной линии) -->
      <g font-family="'Montserrat', 'Arial Black', sans-serif" 
         font-weight="900" 
         font-size="115" 
         fill="#000000" 
         text-anchor="middle" 
         letter-spacing="1">
        
        <text x="300" y="380">люди<tspan fill="#C1FF00">.</tspan></text>
        <text x="500" y="520">смыслы<tspan fill="#C1FF00">.</tspan></text>
        <text x="700" y="660">технологии<tspan fill="#C1FF00">.</tspan></text>
        
      </g>
    </g>
  </g>
</svg>
</div>

</body>
</html>
